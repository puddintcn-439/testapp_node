name: Update Project Map

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run project map generator
        run: |
          node scripts/generate_project_map.js

      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore(project-map): update project_map
          branch: automation/update-project-map-${{ github.run_id }}
          title: chore(project-map): update project_map
          body: |
            This PR was auto-generated by the project map workflow. It updates `docs/project_map.md` to reflect the latest repository layout.
          labels: automation,project-map
          pull-request-namespace: github-actions
